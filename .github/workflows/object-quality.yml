name: BlackIndex object quality

on:
  push:
    branches: [main]
    paths:
      - 'objects/**'
      - 'metadata/**'
      - 'extractions/**'
      - 'docs/reviews/**'
      - 'docs/research-clusters/**'
      - 'tools/validate-evidence-objects.py'
      - 'tools/source-lineage.py'
      - 'tools/dependency-audit.py'
      - 'tools/research-reference-audit.py'
      - 'tools/source-lineage-ui.py'
      - 'tests/**'
      - '.github/workflows/object-quality.yml'
  pull_request:
    paths:
      - 'objects/**'
      - 'metadata/**'
      - 'extractions/**'
      - 'docs/reviews/**'
      - 'docs/research-clusters/**'
      - 'tools/validate-evidence-objects.py'
      - 'tools/source-lineage.py'
      - 'tools/dependency-audit.py'
      - 'tools/research-reference-audit.py'
      - 'tools/source-lineage-ui.py'
      - 'tests/**'
      - '.github/workflows/object-quality.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema
      - name: Validate durable evidence objects
        run: python3 tools/validate-evidence-objects.py --root .
      - name: Compile source lineage
        run: python3 tools/source-lineage.py --root .
      - name: Audit unencoded document references
        run: python3 tools/dependency-audit.py --root .
      - name: Audit research-note cross references
        run: python3 tools/research-reference-audit.py --root .
      - name: Render source-lineage UI
        run: python3 tools/source-lineage-ui.py --root .
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
